<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" role="img" aria-labelledby="titulo">
  <title id="titulo">Combi rumbo al horizonte de la Ciudad de México de la que salen globos de diálogo</title>

  <style>
    /* velocidades, ciclo general = 7s */

    /* sol: respira muy sutil */
    .sol { transform-box: fill-box; transform-origin: 50% 50%; animation: respirar 7s ease-in-out infinite; }
    @keyframes respirar { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

    /* estrellas: titilan a ritmos distintos, divisores de 7s para que el bucle cierre */
    .estrella { transform-box: fill-box; transform-origin: 50% 50%; animation: titilar 2.3333s ease-in-out infinite; }
    .t2 { animation-duration: 1.75s; animation-delay: -0.6s; }
    .t3 { animation-duration: 3.5s;  animation-delay: -1.3s; }
    .t4 { animation-duration: 1.4s;  animation-delay: -0.9s; }
    .t5 { animation-duration: 2.3333s; animation-delay: -1.7s; }
    @keyframes titilar { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .3; transform: scale(.55); } }

    /* carretera: rayas que viajan al punto de fuga, curva exponencial = perspectiva */
    .raya { transform-box: fill-box; transform-origin: 50% 50%; animation: avanzar 7s linear infinite; }
    #raya-2 { animation-delay: -1.4s; }
    #raya-3 { animation-delay: -2.8s; }
    #raya-4 { animation-delay: -4.2s; }
    #raya-5 { animation-delay: -5.6s; }
    @keyframes avanzar {
      0%   { transform: translateY(0)         scale(1);    opacity: 1; }
      10%  { transform: translateY(-60.2px)   scale(.705); }
      20%  { transform: translateY(-102.6px)  scale(.497); }
      30%  { transform: translateY(-132.6px)  scale(.35);  }
      40%  { transform: translateY(-153.6px)  scale(.247); }
      50%  { transform: translateY(-168.5px)  scale(.174); }
      60%  { transform: translateY(-179.1px)  scale(.122); opacity: 1; }
      70%  { transform: translateY(-186.5px)  scale(.086); }
      80%  { transform: translateY(-191.6px)  scale(.061); opacity: .7; }
      90%  { transform: translateY(-195.2px)  scale(.043); }
      100% { transform: translateY(-197.9px)  scale(.03);  opacity: 0; }
    }

    /* combi: balanceo desde el centro de las llantas + rebote de suspension */
    .combi-balanceo { transform-box: fill-box; transform-origin: 50% 94%; animation: balanceo 3.5s ease-in-out infinite; }
    @keyframes balanceo { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
    .combi-rebote { animation: rebote .875s ease-in-out infinite; }
    @keyframes rebote { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
    .equipaje { animation: rebote-equipaje .875s ease-in-out -.75s infinite; }
    @keyframes rebote-equipaje { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.2px); } }

    /* calaveras traseras */
    .luz { animation: brillo 1.75s ease-in-out infinite; }
    @keyframes brillo { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .halo { animation: halo 1.75s ease-in-out infinite; }
    @keyframes halo { 0%, 100% { opacity: 0; } 50% { opacity: .85; } }

    /* globos de dialogo: pop, suben ondulando, se achican y se desvanecen */
    .vaiven { animation: vaiven 1.75s ease-in-out infinite alternate; }
    @keyframes vaiven { from { transform: translateX(-5px); } to { transform: translateX(5px); } }
    .globo { transform-box: fill-box; transform-origin: 50% 100%; animation: subir-a 7s linear infinite; }
    .globo.b { animation-name: subir-b; }
    #globo-2 .globo { animation-delay: -1.4s; }  #globo-2 .vaiven { animation-delay: -.5s; }
    #globo-3 .globo { animation-delay: -2.8s; }  #globo-3 .vaiven { animation-delay: -1.1s; }
    #globo-4 .globo { animation-delay: -4.2s; }  #globo-4 .vaiven { animation-delay: -.3s; }
    #globo-5 .globo { animation-delay: -5.6s; }  #globo-5 .vaiven { animation-delay: -1.4s; }
    @keyframes subir-a {
      0%   { transform: translate(0, 0)          scale(0);    opacity: 0; }
      7%   { transform: translate(0, -8px)       scale(1.15); opacity: 1; }
      13%  { transform: translate(-2px, -18px)   scale(1); }
      70%  { transform: translate(-30px, -150px) scale(.7);   opacity: .9; }
      100% { transform: translate(-44px, -215px) scale(.48);  opacity: 0; }
    }
    @keyframes subir-b {
      0%   { transform: translate(0, 0)          scale(0);    opacity: 0; }
      7%   { transform: translate(0, -8px)       scale(1.15); opacity: 1; }
      13%  { transform: translate(2px, -18px)    scale(1); }
      70%  { transform: translate(-8px, -150px)  scale(.7);   opacity: .9; }
      100% { transform: translate(-14px, -215px) scale(.48);  opacity: 0; }
    }

    /* movimiento reducido: queda fija */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      #raya-1 { transform: translateY(-60.2px)  scale(.705); }
      #raya-2 { transform: translateY(-102.6px) scale(.497); }
      #raya-3 { transform: translateY(-153.6px) scale(.247); }
      #raya-4 { transform: translateY(-179.1px) scale(.122); }
      #raya-5 { transform: translateY(-191.6px) scale(.061); opacity: .7; }
      #globo-2, #globo-4 { display: none; }
      #globo-1 .globo { transform: translate(-8px, -80px)   scale(.95); }
      #globo-3 .globo { transform: translate(-26px, -120px) scale(.78); }
      #globo-5 .globo { transform: translate(-40px, -196px) scale(.58); }
    }
  </style>

  <defs>
    <clipPath id="clip-marco">
      <path d="M40 240A200 200 0 0 1 440 240V466Q440 490 416 490H64Q40 490 40 466Z"/>
    </clipPath>
    <clipPath id="clip-cuerpo-combi">
      <path d="M-52-14Q-64-14-64-26V-78C-64-104-58-122-40-126Q0-131 40-126C58-122 64-104 64-78V-26Q64-14 52-14Z"/>
    </clipPath>
    <!-- globo: la punta de la colita esta en (-10, 2) -->
    <path id="forma-globo" d="M-1-6H7a10 10 0 0 0 10-10v-4a10 10 0 0 0-10-10H-7a10 10 0 0 0-10 10v4a10 10 0 0 0 10 10L-10 2Z" stroke="#0b0f2a" stroke-width="3" stroke-linejoin="round"/>
    <g id="puntos" fill="#0b0f2a">
      <circle cx="-7" cy="-18" r="2.4"/><circle cx="0" cy="-18" r="2.4"/><circle cx="7" cy="-18" r="2.4"/>
    </g>
    <path id="ondas" d="M-9-18q2.25-5 4.5 0t4.5 0t4.5 0t4.5 0" fill="none" stroke="#0b0f2a" stroke-width="2.5" stroke-linecap="round"/>
  </defs>

  <!-- sombra plana del marco -->
  <path id="marco-sombra" d="M40 240A200 200 0 0 1 440 240V466Q440 490 416 490H64Q40 490 40 466Z" transform="translate(7 7)" fill="#632e62"/>

  <g id="escena" clip-path="url(#clip-marco)">

    <!-- cielo por franjas planas -->
    <g id="cielo">
      <rect width="480" height="150" fill="#632e62"/>
      <rect y="150" width="480" height="55" fill="#9a3412"/>
      <rect y="205" width="480" height="50" fill="#c2410c"/>
      <rect y="255" width="480" height="70" fill="#d95f0e"/>
    </g>

    <g id="estrellas" fill="#fff4e8">
      <path class="estrella" d="M160 93q1 6 7 7q-6 1-7 7q-1-6-7-7q6-1 7-7z"/>
      <path class="estrella t3" d="M292 80q1.2 6.8 8 8q-6.8 1.2-8 8q-1.2-6.8-8-8q6.8-1.2 8-8z"/>
      <path class="estrella t5" d="M392 171q.9 4.1 5 5q-4.1.9-5 5q-.9-4.1-5-5q4.1-.9 5-5z"/>
      <circle class="estrella t2" cx="214" cy="70" r="2.2"/>
      <circle class="estrella t4" cx="352" cy="128" r="2.2"/>
      <circle class="estrella t3" cx="250" cy="56" r="1.8"/>
      <circle class="estrella t2" cx="198" cy="140" r="1.8"/>
      <circle class="estrella t4" cx="110" cy="160" r="2"/>
    </g>

    <g id="sol">
      <circle class="sol" cx="240" cy="320" r="74" fill="#d95f0e" stroke="#f6e3cc" stroke-width="4"/>
    </g>

    <!-- iztaccihuatl (recostada, izquierda) y popocatepetl (cono, derecha) -->
    <g id="volcanes">
      <path id="iztaccihuatl" fill="#632e62" d="M24 322L40 298Q50 288 62 290Q72 292 80 284L104 260Q116 250 128 256L144 266Q154 262 164 268L186 288L206 322Z"/>
      <path fill="#f6e3cc" d="M98 266L104 260Q116 250 128 256L138 262L129 262L121 268L113 261Z"/>
      <path id="popocatepetl" fill="#632e62" d="M284 322L352 232Q357 226 363 226H377Q383 226 388 232L462 322Z"/>
      <path fill="#f6e3cc" d="M338 251L352 232Q357 226 363 226H377Q383 226 388 232L402 250L392 246L384 254L372 244L360 254L350 246Z"/>
    </g>

    <rect id="suelo" y="320" width="480" height="200" fill="#632e62"/>

    <g id="ciudad">
      <path fill="#0b0f2a" d="M30 322V300H58V288H72V302H92V282H102V296H126V290H144V304H170V294H184V301H204V307H218V311H262V305H276V297H298V287H310V301H336V293H354V305H378V285H392V299H414V292H450V322Z"/>
      <path d="M97 282V272" stroke="#0b0f2a" stroke-width="2" stroke-linecap="round"/>
      <g id="ventanitas" fill="#fff4e8">
        <rect x="95" y="288" width="3" height="4"/><rect x="95" y="297" width="3" height="4"/>
        <rect x="62" y="294" width="3" height="4"/><rect x="131" y="296" width="3" height="4"/>
        <rect x="301" y="293" width="3" height="4"/><rect x="381" y="291" width="3" height="4"/>
        <rect x="386" y="300" width="3" height="4"/><rect x="420" y="298" width="3" height="4"/>
        <rect x="282" y="303" width="3" height="4"/>
      </g>
    </g>

    <g id="carretera">
      <path fill="#0b0f2a" d="M237 320H243L425 500H55Z"/>
      <path d="M237 320L55 500M243 320L425 500" stroke="#fff4e8" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- 5 rayas escalonadas, todas parten de abajo (fuera del marco) -->
    <g id="rayas" fill="#d95f0e">
      <path id="raya-1" class="raya" d="M232 546H248L246 502H234Z"/>
      <path id="raya-2" class="raya" d="M232 546H248L246 502H234Z"/>
      <path id="raya-3" class="raya" d="M232 546H248L246 502H234Z"/>
      <path id="raya-4" class="raya" d="M232 546H248L246 502H234Z"/>
      <path id="raya-5" class="raya" d="M232 546H248L246 502H234Z"/>
    </g>

    <!-- combi de espaldas, origen local (0,0) = piso, entre las llantas -->
    <g id="combi" transform="translate(317 470) scale(.9)">
      <g class="combi-balanceo">
        <rect x="-76" y="-182" width="152" height="182" fill="none"/><!-- caja fija para el transform-origin -->
        <g id="llantas" fill="#0b0f2a" stroke="#3f6ea8" stroke-width="3">
          <rect x="-57" y="-26" width="22" height="26" rx="6"/>
          <rect x="35" y="-26" width="22" height="26" rx="6"/>
        </g>
        <g class="combi-rebote" stroke="#0b0f2a" stroke-linecap="round" stroke-linejoin="round">
          <g id="espejos" stroke-width="2.5">
            <path d="M-63-92L-69-97M63-92L69-97" fill="none" stroke-width="3"/>
            <rect x="-76" y="-108" width="9" height="13" rx="3" fill="#fff4e8"/>
            <rect x="67" y="-108" width="9" height="13" rx="3" fill="#fff4e8"/>
          </g>
          <g id="carroceria">
            <path d="M-52-14Q-64-14-64-26V-78C-64-104-58-122-40-126Q0-131 40-126C58-122 64-104 64-78V-26Q64-14 52-14Z" fill="#3f6ea8" stroke="none"/>
            <rect x="-70" y="-140" width="140" height="66" fill="#fff4e8" stroke="none" clip-path="url(#clip-cuerpo-combi)"/>
            <path d="M-64-74H64" fill="none" stroke-width="3"/>
            <path d="M-52-14Q-64-14-64-26V-78C-64-104-58-122-40-126Q0-131 40-126C58-122 64-104 64-78V-26Q64-14 52-14Z" fill="none" stroke-width="3.5"/>
          </g>
          <g id="portezuela">
            <rect x="-46" y="-118" width="92" height="40" rx="14" fill="none" stroke-width="2.5"/>
            <rect x="-38" y="-112" width="76" height="26" rx="10" fill="#a9c4e8" stroke-width="3"/>
            <path d="M-20-109H-12L-22-89H-30ZM-6-109H-2L-12-89H-16Z" fill="#fffbf6" stroke="none"/>
            <rect x="-8" y="-84" width="16" height="4" rx="2" fill="#0b0f2a" stroke="none"/>
          </g>
          <g id="motor">
            <rect x="-32" y="-68" width="64" height="30" rx="8" fill="#3f6ea8" stroke-width="3"/>
            <path d="M-23-60H-8M-23-53H-8M-23-46H-8M8-60H23M8-53H23M8-46H23" fill="none" stroke-width="3"/>
            <rect x="-13" y="-36" width="26" height="11" rx="2" fill="#fffbf6" stroke-width="2.5"/>
          </g>
          <g id="calaveras">
            <circle cx="-52" cy="-50" r="6.5" fill="#9a3412" stroke-width="2.5"/>
            <circle cx="52" cy="-50" r="6.5" fill="#9a3412" stroke-width="2.5"/>
            <circle class="luz" cx="-52" cy="-50" r="4.6" fill="#d95f0e" stroke="none"/>
            <circle class="luz" cx="52" cy="-50" r="4.6" fill="#d95f0e" stroke="none"/>
            <circle class="halo" cx="-52" cy="-50" r="10.5" fill="none" stroke="#d95f0e" stroke-width="2.5" opacity=".6"/>
            <circle class="halo" cx="52" cy="-50" r="10.5" fill="none" stroke="#d95f0e" stroke-width="2.5" opacity=".6"/>
          </g>
          <rect id="parachoques" x="-68" y="-24" width="136" height="10" rx="5" fill="#f6e3cc" stroke-width="3"/>
          <g id="parrilla">
            <path d="M-40-126V-134M-14-129V-134M14-129V-134M40-126V-134" fill="none" stroke-width="3"/>
            <rect x="-50" y="-138" width="100" height="6" rx="3" fill="#f6e3cc" stroke-width="2.5"/>
          </g>
          <g id="equipaje" class="equipaje" stroke-width="3">
            <rect x="-46" y="-164" width="50" height="26" rx="5" fill="#d95f0e"/>
            <path d="M-36-164V-138M-4-164V-138" fill="none" stroke-width="2.5"/>
            <rect x="8" y="-158" width="36" height="20" rx="4" fill="#f1dcef"/>
            <path d="M8-151H44" fill="none" stroke-width="2.5"/>
            <rect x="23" y="-153" width="6" height="5" rx="1" fill="#0b0f2a" stroke="none"/>
            <rect x="-38" y="-178" width="36" height="14" rx="7" fill="#a9c4e8"/>
            <circle cx="-9" cy="-171" r="3.2" fill="none" stroke-width="2"/>
            <path d="M-48-146C-20-150 20-150 46-146" fill="none" stroke-width="2.5"/>
          </g>
        </g>
      </g>
    </g>

    <!-- globos de dialogo: cada uno nace en una ventana o en el techo de la combi -->
    <g id="globos">
      <g id="globo-1" transform="translate(288 372)"><g class="vaiven"><g class="globo a">
        <use href="#forma-globo" fill="#fff4e8"/><use href="#puntos"/>
      </g></g></g>
      <g id="globo-2" transform="translate(344 370)"><g class="vaiven"><g class="globo b">
        <use href="#forma-globo" fill="#a9c4e8"/><use href="#ondas"/>
      </g></g></g>
      <g id="globo-3" transform="translate(308 318)"><g class="vaiven"><g class="globo a">
        <use href="#forma-globo" fill="#d95f0e"/><use href="#puntos"/>
      </g></g></g>
      <g id="globo-4" transform="translate(278 345)"><g class="vaiven"><g class="globo b">
        <use href="#forma-globo" fill="#f1dcef"/><use href="#puntos"/>
      </g></g></g>
      <g id="globo-5" transform="translate(352 326)"><g class="vaiven"><g class="globo a">
        <use href="#forma-globo" fill="#f6e3cc"/><use href="#ondas"/>
      </g></g></g>
    </g>
  </g>

  <path id="marco" d="M40 240A200 200 0 0 1 440 240V466Q440 490 416 490H64Q40 490 40 466Z" fill="none" stroke="#fff4e8" stroke-width="5"/>
</svg>
